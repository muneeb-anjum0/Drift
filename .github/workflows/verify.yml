name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/inference/requirements-dev.txt
      - run: npm ci
      - run: pip install --requirement services/inference/requirements-dev.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Go formatting
        run: test -z "$(cd server-go && gofmt -l .)"
      - run: cd server-go && go vet ./...
      - run: cd server-go && go test ./...
      - run: cd server-go && go build -o /tmp/driftledger-api-verify ./cmd/api
      - run: python -m pytest services/inference/test_app.py
      - run: python -m pytest tools/verification/test_phase3g_batch_research.py
      - run: python -m pytest tools/verification/test_phase3h_contracts.py
      - run: python -m pytest tools/verification/test_phase3i_review.py
      - run: python -m pytest tools/verification/test_phase3i_oracle.py
      - run: python -m pytest tools/verification/test_phase3i_score_raw.py
      - run: python -m pytest tools/verification/test_phase3i_overlap_historical.py
      - run: python -m pytest tools/verification/test_phase3i5_freeze.py tools/verification/test_phase3i5_review_evidence.py tools/verification/test_phase3i5_score.py tools/verification/test_phase3i5_error_taxonomy.py
      - run: ruff check services/inference tools
      - run: npm audit --audit-level=high
      - run: pip-audit --requirement services/inference/requirements.txt
      - name: Go vulnerability scan
        run: cd server-go && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Compose validation
        env:
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          DRIFT_INFERENCE_API_KEY: ci-only-inference-key-at-least-32-characters
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 2)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Mongo-backed invariants
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: cd server-go && go test -count=1 ./internal/integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start application without model
        env:
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          DRIFT_INFERENCE_API_KEY: ci-only-inference-key-at-least-32-characters
        run: docker compose up -d --build --wait db inference backend frontend
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose-e2e.log && docker compose down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            compose-e2e.log
            client/test-results
            client/playwright-report
