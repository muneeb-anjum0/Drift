name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Frozen document hashes are verified against the pre-compression commit.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai_model/inference/requirements-dev.txt
      - run: cd frontend && npm ci
      - run: pip install --requirement ai_model/inference/requirements-dev.txt
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build
      - name: Go formatting
        run: test -z "$(cd backend && gofmt -l .)"
      - run: cd backend && go vet ./...
      - run: cd backend && go test ./...
      - run: cd backend && go build -o /tmp/driftledger-api-verify ./cmd/api
      - run: python -m pytest ai_model/inference/test_app.py
      - run: python -m pytest tools/verification/test_phase3g_batch_research.py
      - run: python -m pytest tools/verification/test_phase3h_contracts.py
      - run: python -m pytest tools/verification/test_phase3i_review.py
      - run: python -m pytest tools/verification/test_phase3i_oracle.py
      - run: python -m pytest tools/verification/test_phase3i_score_raw.py
      - run: python -m pytest tools/verification/test_phase3i_overlap_historical.py
      - run: python -m pytest tools/verification/test_phase3i5_freeze.py tools/verification/test_phase3i5_review_evidence.py tools/verification/test_phase3i5_score.py tools/verification/test_phase3i5_error_taxonomy.py
      - run: python -m pytest tools/verification/test_phase3j_audit_training.py tools/verification/test_phase3j_freeze_inputs.py
      - run: python -m pytest tools/verification/test_staging_env.py
      - run: python -m pytest tools/verification/test_staging_ingress.py
      - run: python -m pytest tools/verification/test_local_compose.py
      - run: python -m pytest tools/verification/test_local_setup.py
      - run: ruff check ai_model/inference ai_model/tooling tools
      - run: cd frontend && npm audit --audit-level=high
      - run: pip-audit --requirement ai_model/inference/requirements.txt
      - name: Go vulnerability scan
        run: cd backend && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Compose validation
        env:
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          DRIFT_INFERENCE_API_KEY: ci-only-inference-key-at-least-32-characters
          STAGING_RELEASE_ID: ${{ github.sha }}
          STAGING_JWT_SECRET: ci-only-staging-jwt-at-least-32-characters
          STAGING_INFERENCE_API_KEY: ci-only-staging-inference-at-least-32-characters
          STAGING_MONGO_PASSWORD: ci-only-staging-mongo-password
          STAGING_ORIGINAL_GGUF: /tmp/ci-config-only-not-a-model.gguf
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/compose/gpu.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/compose/test.yml config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.yml -f deploy/compose/staging.yml --profile model config --quiet

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 2)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Mongo-backed invariants
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: cd backend && go test -count=1 ./internal/integration ./internal/database

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start application without model
        env:
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          DRIFT_INFERENCE_API_KEY: ci-only-inference-key-at-least-32-characters
        run: docker compose up -d --build --wait db inference backend frontend
      - run: cd frontend && npm run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose-e2e.log && docker compose down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            compose-e2e.log
            frontend/test-results
            frontend/playwright-report
