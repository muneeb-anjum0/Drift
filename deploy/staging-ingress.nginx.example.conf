# Review and replace this template on the staging host; do not enable it here.
# The TLS proxy must join drift-staging_staging-internal at the configured
# STAGING_TLS_PROXY_IP and be the only public entrypoint. No certificates in Git.
server {
    listen 80;
    server_name staging.example.invalid;
    return 301 https://staging.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.example.invalid;
    ssl_certificate /run/secrets/staging_tls.crt;
    ssl_certificate_key /run/secrets/staging_tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        # Replace client-supplied forwarding headers; never append them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
